<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AllCompetitionClasses - Grammar Player + Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0c29;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(90deg, #1a1a2e, #16213e);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #e94560;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.3rem; color: #e94560; }
        .header p { font-size: 0.75rem; color: #888; margin-top: 3px; }
        .container { padding: 10px; max-width: 100%; }
        .player-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .now-playing {
            margin-top: 10px;
            padding: 10px;
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            border-left: 3px solid #e94560;
        }
        .now-playing h3 { font-size: 0.9rem; color: #fff; }
        .now-playing p { font-size: 0.75rem; color: #888; margin-top: 3px; }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-red { background: #e94560; color: white; }
        .btn-dark { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .playlist-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .playlist-header {
            padding: 8px;
            background: rgba(233, 69, 96, 0.15);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .playlist-header h2 { font-size: 0.9rem; color: #e94560; }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            margin-top: 8px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.8rem;
        }
        .video-list {
            max-height: 55vh;
            overflow-y: auto;
        }
        .video-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1px solid transparent;
        }
        .video-item.active {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }
        .v-num {
            width: 26px;
            height: 26px;
            background: rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #e94560;
            flex-shrink: 0;
        }
        .v-title {
            flex: 1;
            font-size: 0.75rem;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .v-btns {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .v-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }
        .v-btn-play { background: #e94560; }
        .v-btn-dl { background: #22c55e; }
        .status-msg {
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: none;
        }
        .status-msg.show { display: block; }
        .status-msg.ok { background: rgba(0,255,0,0.1); color: #4ade80; }
        .status-msg.err { background: rgba(255,0,0,0.1); color: #f87171; }
        .status-msg.load { background: rgba(255,193,7,0.1); color: #fbbf24; }
        .status-msg.info { background: rgba(59,130,246,0.1); color: #60a5fa; }
        .dl-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
        }
        .dl-overlay.show { display: flex; }
        .dl-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #22c55e;
            text-align: center;
            max-width: 90%;
        }
        .dl-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(34,197,94,0.2);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .dl-title { font-size: 1.1rem; color: #22c55e; margin-bottom: 10px; }
        .dl-text { font-size: 0.8rem; color: #aaa; }
        .dl-filename { font-size: 0.75rem; color: #888; margin-top: 5px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AllCompetitionClasses</h1>
        <p>Grammar Course - 158 Videos | Play Live or Download</p>
    </div>

    <div class="container">
        <div class="player-box">
            <div class="video-wrapper">
                <video id="player" controls playsinline></video>
            </div>
            <div class="now-playing" id="nowPlaying">
                <h3>Select a video to play or download</h3>
                <p>Tap PLAY to stream | Tap DL to get download script</p>
            </div>
            <div class="controls">
                <button class="btn btn-red" onclick="stopVideo()">Stop</button>
                <button class="btn btn-dark" onclick="fullScreen()">Fullscreen</button>
            </div>
            <div id="status" class="status-msg"></div>
        </div>

        <div class="playlist-box">
            <div class="playlist-header">
                <h2>Video Playlist (158) - Play or Download</h2>
                <input type="text" class="search-box" id="searchInput" 
                       placeholder="Search video..." onkeyup="doSearch()">
            </div>
            <div class="video-list" id="videoList"></div>
        </div>
    </div>

    <div class="dl-overlay" id="dlOverlay">
        <div class="dl-box">
            <div class="dl-spinner"></div>
            <div class="dl-title">Downloading Script...</div>
            <div class="dl-text">Python script is being generated</div>
            <div class="dl-filename" id="dlFilename"></div>
        </div>
    </div>

    <script>
        const videoData = [
            {id:1, title:"Syllabus Discussion Video 1", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_40_NS_ENG_P1_9JUNE23.mp4"},
            {id:2, title:"Basic Concept SSC Parts Of Speech CDS Class 01 Video 2", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_13JULY23.mp4"},
            {id:3, title:"Basic Concept SSC Parts Of Speech CDS Class 02 Video 3", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_15JULY23.mp4"},
            {id:4, title:"Basic Concept SSC Parts Of Speech CDS Class 03 Part 1 Video 4", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_18JULY23.mp4"},
            {id:5, title:"Basic Concept SSC Parts Of Speech CDS Class 03 Part 2 Video 5", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P2_18JULY23.mp4"},
            {id:6, title:"Basic Concept SSC Parts Of Speech CDS Class 04 Video 6", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_20JULY23.mp4"},
            {id:7, title:"Topic Noun Class 05 Part 01 Video 7", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_22JULY23.mp4"},
            {id:8, title:"Topic Noun Class 05 Part 02 Video 8", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P2_22JULY23.mp4"},
            {id:9, title:"Topic Noun Class 06 Video 9", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_25JULY23.mp4"},
            {id:10, title:"Topic Noun Class 07 Video 10", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_43_NS_ENG_P1_27JULY23.mp4"},
            {id:43, title:"Topic Verb Class 28 Video 43", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_36_NS_ENG_P1_15MAY23.mp4"},
            {id:44, title:"Topic Confusing Verb Class 29 Video 44", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_36_NS_ENG_P1_19MAY23.mp4"},
            {id:158, title:"Topic Verb Class 143 Video 158", baseUrl:"https://689dfa6beb89c.streamlock.net/kdlivevod/mp4:KD_ENG_36_NS_ENG_P1_9FEB24.mp4"}
        ];

        let hls = null;
        let currentId = null;

        function renderList(list) {
            const container = document.getElementById('videoList');
            let html = '';
            for (let i = 0; i < list.length; i++) {
                const v = list[i];
                const active = v.id === currentId ? 'active' : '';
                html += '<div class="video-item ' + active + '">' +
                    '<div class="v-num">' + v.id + '</div>' +
                    '<div class="v-title">' + v.title + '</div>' +
                    '<div class="v-btns">' +
                    '<button class="v-btn v-btn-play" onclick="play(' + v.id + ')">PLAY</button>' +
                    '<button class="v-btn v-btn-dl" onclick="downloadVideo(' + v.id + ')">DL</button>' +
                    '</div>' +
                    '</div>';
            }
            container.innerHTML = html;
        }

        renderList(videoData);

        function doSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videoData.filter(function(v) {
                return v.title.toLowerCase().indexOf(q) !== -1;
            });
            renderList(filtered);
        }

        function play(id) {
            const video = videoData.find(function(v) { return v.id === id; });
            if (!video) return;
            currentId = id;
            renderList(videoData);
            document.getElementById('nowPlaying').innerHTML = 
                '<h3>' + video.title + '</h3><p>Loading stream...</p>';
            showStatus('Loading HLS stream...', 'load');
            const player = document.getElementById('player');
            if (hls) { hls.destroy(); hls = null; }
            const streamUrl = video.baseUrl + '/playlist.m3u8';
            if (Hls.isSupported()) {
                hls = new Hls({ debug: false, enableWorker: true });
                hls.loadSource(streamUrl);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play();
                    document.getElementById('nowPlaying').innerHTML = 
                        '<h3>Now Playing: ' + video.title + '</h3><p>Live stream</p>';
                    showStatus('Stream loaded!', 'ok');
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = streamUrl;
                player.play();
            }
        }

        function downloadVideo(id) {
            const video = videoData.find(function(v) { return v.id === id; });
            if (!video) return;
            document.getElementById('dlFilename').textContent = video.title;
            document.getElementById('dlOverlay').classList.add('show');

            const safeName = video.title.replace(/[^a-zA-Z0-9]/g, '_');
            const pyScript = 'import requests\n' +
                'import re\n' +
                'import os\n' +
                'import sys\n' +
                'from concurrent.futures import ThreadPoolExecutor, as_completed\n' +
                '\n' +
                'BASE_URL = "' + video.baseUrl + '"\n' +
                'OUTPUT_TS = "video_' + id + '_' + safeName + '.ts"\n' +
                'OUTPUT_MP4 = OUTPUT_TS.replace(".ts", ".mp4")\n' +
                'MAX_WORKERS = 8\n' +
                '\n' +
                'HEADERS = {\n' +
                '    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",\n' +
                '    "Referer": "https://www.allcompetitionclasses.co.in/",\n' +
                '}\n' +
                '\n' +
                'def get_master_playlist():\n' +
                '    master_url = BASE_URL + "/playlist.m3u8"\n' +
                '    print("[1/4] Fetching playlist...")\n' +
                '    r = requests.get(master_url, headers=HEADERS, timeout=15)\n' +
                '    r.raise_for_status()\n' +
                '    match = re.search(r\'chunklist_[^\\s]+\', r.text)\n' +
                '    if not match:\n' +
                '        raise ValueError("Chunklist not found")\n' +
                '    return BASE_URL + "/" + match.group(0)\n' +
                '\n' +
                'def get_segments(chunklist_url):\n' +
                '    print("[2/4] Getting segments...")\n' +
                '    r = requests.get(chunklist_url, headers=HEADERS, timeout=15)\n' +
                '    segments = re.findall(r\'media_[^\\s]+\', r.text)\n' +
                '    print("      Found", len(segments), "segments")\n' +
                '    return segments\n' +
                '\n' +
                'def download_segment(args):\n' +
                '    seg, idx, total = args\n' +
                '    try:\n' +
                '        r = requests.get(BASE_URL + "/" + seg, headers=HEADERS, timeout=30)\n' +
                '        return (idx, r.content, None)\n' +
                '    except Exception as e:\n' +
                '        return (idx, None, str(e))\n' +
                '\n' +
                'def download_all(segments):\n' +
                '    total = len(segments)\n' +
                '    print("[3/4] Downloading", total, "segments...")\n' +
                '    data = [None] * total\n' +
                '    completed = 0\n' +
                '    failed = 0\n' +
                '    with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:\n' +
                '        futures = {ex.submit(download_segment, (seg, i, total)): i for i, seg in enumerate(segments)}\n' +
                '        for future in as_completed(futures):\n' +
                '            idx, content, err = future.result()\n' +
                '            if content:\n' +
                '                data[idx] = content\n' +
                '                completed += 1\n' +
                '            else:\n' +
                '                failed += 1\n' +
                '            progress = (completed + failed) / total * 100\n' +
                '            print("\\r      " + str(completed+failed) + "/" + str(total) + " (" + str(int(progress)) + "%) OK:" + str(completed) + " Fail:" + str(failed), end="")\n' +
                '    print("\\n      Done:", completed, "OK,", failed, "failed")\n' +
                '    return data\n' +
                '\n' +
                'def merge(data, path):\n' +
                '    print("[4/4] Saving to", path, "...")\n' +
                '    with open(path, "wb") as f:\n' +
                '        for d in data:\n' +
                '            if d:\n' +
                '                f.write(d)\n' +
                '    size = os.path.getsize(path) / (1024*1024)\n' +
                '    print("      Saved:", path, "(" + str(round(size, 1)) + " MB)")\n' +
                '\n' +
                'def convert(ts_path, mp4_path):\n' +
                '    if os.system("ffmpeg -version > /dev/null 2>&1") == 0:\n' +
                '        print("Converting to MP4...")\n' +
                '        os.system(\'ffmpeg -y -i "\' + ts_path + \'" -c copy "\' + mp4_path + \'"\')\n' +
                '        print("MP4 saved:", mp4_path)\n' +
                '        return True\n' +
                '    else:\n' +
                '        print("ffmpeg not found. TS file ready:", ts_path)\n' +
                '        return False\n' +
                '\n' +
                'def main():\n' +
                '    print("="*50)\n' +
                '    print("  Video Downloader - ' + video.title.replace(/"/g, "\\'") + '")\n' +
                '    print("="*50)\n' +
                '    try:\n' +
                '        chunklist = get_master_playlist()\n' +
                '        segments = get_segments(chunklist)\n' +
                '        data = download_all(segments)\n' +
                '        merge(data, OUTPUT_TS)\n' +
                '        convert(OUTPUT_TS, OUTPUT_MP4)\n' +
                '        print("\\nDONE!")\n' +
                '    except Exception as e:\n' +
                '        print("\\nERROR:", e)\n' +
                '        import traceback\n' +
                '        traceback.print_exc()\n' +
                '\n' +
                'if __name__ == "__main__":\n' +
                '    main()\n';

            const blob = new Blob([pyScript], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'download_video_' + id + '.py';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setTimeout(function() {
                document.getElementById('dlOverlay').classList.remove('show');
                showStatus('Python script downloaded! Open in Pydroid 3 and run it.', 'info');
            }, 1500);
        }

        function stopVideo() {
            const player = document.getElementById('player');
            if (hls) { hls.destroy(); hls = null; }
            player.pause(); player.src = ''; player.load();
            document.getElementById('nowPlaying').innerHTML = 
                '<h3>Stopped</h3><p>Select a video to play or download</p>';
            showStatus('Stream stopped', 'ok');
        }

        function fullScreen() {
            const player = document.getElementById('player');
            if (player.requestFullscreen) player.requestFullscreen();
            else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            if (type === 'ok') setTimeout(function() { el.classList.remove('show'); }, 4000);
        }
    </script>
</body>
</html>
