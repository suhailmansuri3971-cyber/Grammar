            color: #fff;

            padding: 8px 12px;
            margin-top: 8px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.8rem;
        }

        .video-list {
            max-height: 50vh;
            overflow-y: auto;
        }

        .video-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .video-item:active {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }

        .video-item.active {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }

        .v-num {
            width: 28px;
            height: 28px;
            background: rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #e94560;
            flex-shrink: 0;
        }

        .v-title {
            flex: 1;
            font-size: 0.8rem;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .v-play {
            width: 24px;
            height: 24px;
            background: rgba(233, 69, 96, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            flex-shrink: 0;
        }

            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;

        let hls = null;
        let currentId = null;

        // Render video list
        function renderList(list) {
            const container = document.getElementById('videoList');
            let html = '';
            for (let i = 0; i < list.length; i++) {
                const v = list[i];
                const active = v.id === currentId ? 'active' : '';
                html += '<div class="video-item ' + active + '" onclick="play(' + v.id + ')">' +
                    '<div class="v-num">' + v.id + '</div>' +
                    '<div class="v-title">' + v.title + '</div>' +
                    '<div class="v-play">▶</div>' +
                    '</div>';
            }
            container.innerHTML = html;
        }

        // Initial render
        renderList(videoData);

        // Search function
        function doSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videoData.filter(function(v) {
                return v.title.toLowerCase().indexOf(q) !== -1;
            });
            renderList(filtered);
        }

        // Play video
        function play(id) {
            const video = videoData.find(function(v) { return v.id === id; });
            if (!video) return;

            currentId = id;
            renderList(videoData);

            document.getElementById('nowPlaying').innerHTML = 
                '<h3>🎬 ' + video.title + '</h3>' +
                '<p>Loading stream...</p>';

            showStatus('Loading HLS stream...', 'load');

            const player = document.getElementById('player');

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    debug: false,
                    enableWorker: true
                });
                hls.loadSource(video.url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play();
                    document.getElementById('nowPlaying').innerHTML = 
                        '<h3>▶ ' + video.title + '</h3>' +
                        '<p>Now playing live stream</p>';
                    showStatus('✅ Stream loaded!', 'ok');
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        showStatus('❌ Stream error: ' + data.type, 'err');
                    }
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = video.url;
                player.play();
            } else {
                showStatus('❌ HLS not supported in this browser', 'err');
            }
        }

        // Stop video
        function stopVideo() {
            const player = document.getElementById('player');
            if (hls) {
                hls.destroy();
                hls = null;
            }
            player.pause();
            player.src = '';
            player.load();
            document.getElementById('nowPlaying').innerHTML = 
                '<h3>⏹ Stopped</h3>' +
                '<p>Select a video to play</p>';
            showStatus('Stream stopped', 'ok');
        }

        // Fullscreen
        function fullScreen() {
            const player = document.getElementById('player');
            if (player.requestFullscreen) {
                player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            }
        }

        // Show status
        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            if (type === 'ok') {
                setTimeout(function() { el.classList.remove('show'); }, 3000);
            }
        }
    </script>
